name: One-time school notice enrichment validation
on:
  push:
    paths:
      - '.github/workflows/notice-enrichment-smoke-once.yml'
permissions:
  contents: read
jobs:
  validate:
    if: contains(github.event.head_commit.message, 'NOTICE_ENRICHMENT_SMOKE_ONCE_20261116')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      TIMETABLE_SHEET_ID: ${{ secrets.TIMETABLE_SHEET_ID }}
      EALIMI_ID: ${{ secrets.EALIMI_ID }}
      EALIMI_PASSWORD: ${{ secrets.EALIMI_PASSWORD }}
      EALIMI_LIST_URL: ${{ secrets.EALIMI_LIST_URL }}
      RUN_MODE: ealimi
      NOTICE_ENRICH_ENABLED: 'true'
      EALIMI_DETAIL_MAX_PER_RUN: '5'
      NOTICE_DRIVE_FOLDER_ID: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-notices.txt
      - name: Install dependencies
        run: pip install -r requirements-notices.txt
      - name: Install headless browser
        run: python -m playwright install --with-deps chromium
      - name: Test parsers and privacy guards
        run: python -m pytest tests/test_notices.py tests/test_notice_enrich.py -q
      - name: Verify private notice detail extraction
        run: python notice_sync.py
