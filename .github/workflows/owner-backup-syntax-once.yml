name: One-time backup connector static tests
on:
  push:
    paths:
      - '.github/workflows/owner-backup-syntax-once.yml'
permissions:
  contents: read
jobs:
  test:
    if: contains(github.event.head_commit.message, 'OWNER_BACKUP_TEST_ONCE')
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements-notices.txt
      - name: Check Python and Apps Script syntax
        run: |
          python -m py_compile notice_sync.py notice_enrich.py
          node --check < apps_script/SchoolNoticePdfBackup.gs
      - name: Verify all notice and backup tests
        run: python -m pytest tests/test_notices.py tests/test_notice_enrich.py tests/test_owner_backup.py -q
