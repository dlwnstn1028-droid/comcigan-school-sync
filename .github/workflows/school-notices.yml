name: School notices (Whimoon + eAlimi)

on:
  workflow_dispatch:
    inputs:
      run_mode:
        description: "school / ealimi / all"
        required: true
        default: school
        type: choice
        options: [school, ealimi, all]
  schedule:
    # Korea 07:05 and 18:05. GitHub schedule is UTC and may be delayed.
    - cron: '5 22 * * *'
    - cron: '5 9 * * *'

permissions:
  contents: read

concurrency:
  group: school-notices
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      TIMETABLE_SHEET_ID: ${{ secrets.TIMETABLE_SHEET_ID }}
      EALIMI_ID: ${{ secrets.EALIMI_ID }}
      EALIMI_PASSWORD: ${{ secrets.EALIMI_PASSWORD }}
      EALIMI_LIST_URL: ${{ secrets.EALIMI_LIST_URL }}
      RUN_MODE: ${{ github.event_name == 'schedule' && 'all' || inputs.run_mode }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-notices.txt
      - run: pip install -r requirements-notices.txt
      - run: python -m playwright install --with-deps chromium
      - name: Verify parser
        run: python -m pytest tests/test_notices.py -q
      - name: Collect notices (no private content in job output)
        run: python notice_sync.py
