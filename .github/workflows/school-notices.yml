
name: School notices (Whimoon + eAlimi)

on:
  workflow_dispatch:
    inputs:
      run_mode:
        description: "school / ealimi / all"
        required: true
        default: school
        type: choice
        options: [school, ealimi, all]

  schedule:
    # 한국시간 매일 07:05, 18:05
    # GitHub Actions는 UTC 기준
    - cron: '5 22 * * *'
    - cron: '5 9 * * *'

permissions:
  contents: read

concurrency:
  group: school-notices
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    env:
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      TIMETABLE_SHEET_ID: ${{ secrets.TIMETABLE_SHEET_ID }}
      EALIMI_ID: ${{ secrets.EALIMI_ID }}
      EALIMI_PASSWORD: ${{ secrets.EALIMI_PASSWORD }}
      EALIMI_LIST_URL: ${{ secrets.EALIMI_LIST_URL }}
      NOTICE_ENRICH_ENABLED: ${{ vars.NOTICE_ENRICH_ENABLED || 'true' }}
      NOTICE_DRIVE_FOLDER_ID: ${{ secrets.NOTICE_DRIVE_FOLDER_ID }}
      NOTICE_UPLOAD_WEBAPP_URL: ${{ secrets.NOTICE_UPLOAD_WEBAPP_URL }}
      NOTICE_UPLOAD_TOKEN: ${{ secrets.NOTICE_UPLOAD_TOKEN }}
      EALIMI_DETAIL_MAX_PER_RUN: ${{ vars.EALIMI_DETAIL_MAX_PER_RUN || '5' }}
      PUBLIC_DETAIL_MAX_PER_RUN: ${{ vars.PUBLIC_DETAIL_MAX_PER_RUN || '6' }}
      RUN_MODE: ${{ github.event_name == 'schedule' && (github.event.schedule == '5 9 * * *' && vars.EALIMI_SCHEDULE_ENABLED == 'true' && 'all' || 'school') || inputs.run_mode }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-notices.txt

      - run: pip install -r requirements-notices.txt


      - name: Install browser only when needed
        if: env.RUN_MODE != 'school'
        run: python -m playwright install --with-deps chromium


      - name: Verify parser
        run: python -m pytest tests/test_notices.py tests/test_notice_enrich.py tests/test_owner_backup.py -q

      - name: Collect notices (no private content in job output)
        run: python notice_sync.py
