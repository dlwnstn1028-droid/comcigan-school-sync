name: One-time legacy PDF archive backfill
on:
  push:
    paths: ['.github/workflows/owner-archive-backfill-once.yml']
permissions:
  contents: read
concurrency:
  group: school-notices
  cancel-in-progress: false
jobs:
  backfill:
    if: contains(github.event.head_commit.message, 'PDF_ARCHIVE_BACKFILL_ONCE_20261116')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      TIMETABLE_SHEET_ID: ${{ secrets.TIMETABLE_SHEET_ID }}
      EALIMI_ID: ${{ secrets.EALIMI_ID }}
      EALIMI_PASSWORD: ${{ secrets.EALIMI_PASSWORD }}
      EALIMI_LIST_URL: ${{ secrets.EALIMI_LIST_URL }}
      NOTICE_ENRICH_ENABLED: 'true'
      NOTICE_UPLOAD_WEBAPP_URL: ${{ secrets.NOTICE_UPLOAD_WEBAPP_URL }}
      NOTICE_UPLOAD_TOKEN: ${{ secrets.NOTICE_UPLOAD_TOKEN }}
      NOTICE_DRIVE_FOLDER_ID: ''
      RUN_MODE: all
      NOTICE_BACKFILL_MAX_PER_RUN: '12'
      PUBLIC_DETAIL_MAX_PER_RUN: '6'
      EALIMI_DETAIL_MAX_PER_RUN: '5'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-notices.txt
      - name: Install dependencies
        run: pip install -r requirements-notices.txt
      - name: Install headless browser
        run: python -m playwright install --with-deps chromium
      - name: Run offline parser and backup tests
        run: python -m pytest tests/test_notices.py tests/test_notice_enrich.py tests/test_owner_backup.py -q
      - name: Safely backfill previously parsed PDF attachments
        run: python notice_sync.py
