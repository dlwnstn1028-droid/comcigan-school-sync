
name: Comcigan timetable fetch

on:
  workflow_dispatch:
  schedule:
  # 한국시간 평일 오전 3시
  - cron: '0 18 * * 0-4'
  
permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Fetch and stage timetable
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          TIMETABLE_SHEET_ID: ${{ secrets.TIMETABLE_SHEET_ID }}
        run: python sync.py
