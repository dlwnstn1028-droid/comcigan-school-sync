name: One-time school PDF backup upload probe
on:
  push:
    paths:
      - '.github/workflows/drive-upload-probe-once.yml'
permissions:
  contents: read
jobs:
  probe:
    if: contains(github.event.head_commit.message, 'DRIVE_UPLOAD_RECHECK_20261116')
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      NOTICE_DRIVE_FOLDER_ID: ${{ secrets.NOTICE_DRIVE_FOLDER_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install authentication library
        run: pip install -q google-auth requests
      - name: Confirm API, create a temporary private test file and remove it
        shell: bash
        run: |
          python - <<'PY'
          import os,json,sys,secrets
          from google.oauth2 import service_account
          from google.auth.transport.requests import AuthorizedSession
          folder=os.getenv('NOTICE_DRIVE_FOLDER_ID','').strip()
          auth=os.getenv('GOOGLE_SERVICE_ACCOUNT_JSON','').strip()
          if not folder:
              print('BACKUP_PROBE: FOLDER_SECRET_MISSING')
              sys.exit(1)
          if not auth:
              print('BACKUP_PROBE: AUTH_SECRET_MISSING')
              sys.exit(1)
          try:
              cred=service_account.Credentials.from_service_account_info(
                  json.loads(auth),scopes=['https://www.googleapis.com/auth/drive'])
              client=AuthorizedSession(cred)
              chk=client.get('https://www.googleapis.com/drive/v3/files/'+folder,
                  params={'fields':'id,mimeType'},timeout=25)
              print('BACKUP_PROBE: API_FOLDER_READ_HTTP='+str(chk.status_code))
              if chk.status_code!=200:
                  try: print('BACKUP_PROBE: READ_REASON='+str(chk.json().get('error',{}).get('errors',[{}])[0].get('reason','unknown'))[:60])
                  except Exception: pass
                  sys.exit(2)
              boundary='probe_'+secrets.token_hex(12)
              label={'name':'_temporary_notice_backup_probe.txt','parents':[folder],
                     'mimeType':'text/plain','description':'Temporary automated permission validation'}
              head=('--'+boundary+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'+
                    json.dumps(label)+'\r\n--'+boundary+'\r\nContent-Type: text/plain\r\n\r\n').encode()
              body=head+b'Temporary file for school notice backup permission test.'+('\r\n--'+boundary+'--\r\n').encode()
              response=client.post('https://www.googleapis.com/upload/drive/v3/files',
                  params={'uploadType':'multipart','fields':'id,parents'},data=body,
                  headers={'Content-Type':'multipart/related; boundary='+boundary},timeout=40)
              print('BACKUP_PROBE: UPLOAD_HTTP='+str(response.status_code))
              if response.status_code not in (200,201):
                  try: print('BACKUP_PROBE: UPLOAD_REASON='+str(response.json().get('error',{}).get('errors',[{}])[0].get('reason','unknown'))[:60])
                  except Exception: pass
                  sys.exit(3)
              fid=response.json().get('id')
              if not fid:
                  print('BACKUP_PROBE: UPLOAD_ID_MISSING')
                  sys.exit(4)
              print('BACKUP_PROBE: UPLOAD_OK')
              removal=client.delete('https://www.googleapis.com/drive/v3/files/'+fid,timeout=30)
              print('BACKUP_PROBE: CLEANUP_HTTP='+str(removal.status_code))
              if removal.status_code!=204:sys.exit(5)
              print('BACKUP_PROBE: SUCCESS')
          except Exception as e:
              print('BACKUP_PROBE: EXCEPTION='+type(e).__name__)
              sys.exit(6)
          PY
